name: Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Frontend Dependencies
        run: bun install

      - name: Build Tauri Application & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LynTerminal v__VERSION__ (v1.3.1v)'
          releaseBody: |
            ## LynTerminal v__VERSION__ (v1.3.1v) — Modern Business OS

            Fast, Minimalist, 100% Offline-First, Zero-Telemetry Business OS for Retail Stores, Boutiques, Showrooms, Warehouses & Modern Enterprises.

            ### ⚡ Instant 1-Line Universal Linux Install:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/chronoarchon/LynTerminal/main/install.sh | bash
            ```

            ### 📦 Direct Native Linux Packages (Free Download):
            - **Arch Linux / Manjaro / EndeavourOS**: `lynterminal-1.3.1v-1-x86_64.pkg.tar.zst`
            - **Debian / Ubuntu / Linux Mint**: `lynterminal_1.3.1_amd64.deb`
            - **Fedora / RHEL / openSUSE**: `lynterminal-1.3.1-1.x86_64.rpm`
            - **Universal Standalone**: `lynterminal.gz`

            ### ✨ Key Highlights:
            - **New Minimalist 'L' Logo**: Continuous monoline rounded aesthetic inspired by Braun & Apple design principles.
            - **Apple Minimalist UI**: Clean `#F5F5F7` canvas, elevated white cards, hairline borders, and SF Pro typography.
            - **Zero Telemetry & 100% Offline**: All business ledgers, customer receipts, and payroll are kept strictly on your local computer in SQLite WAL mode.
            - **Complete Retail Suite**: Register POS, Catalog & Multi-Godown Storage, Customer & Supplier Ledgers with Aging, Quotations, Debit Notes, Staff Attendance & Payroll, Cash Closings (Z-Reports), and 1-Click Backup Vault.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Native Distribution Packages to GitHub Release
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          gh release upload "${{ github.ref_name }}" \
            "release/lynterminal-1.3.1v-1-x86_64.pkg.tar.zst" \
            "release/lynterminal_1.3.1_amd64.deb" \
            "release/lynterminal-1.3.1-1.x86_64.rpm" \
            "bin/lynterminal.gz" \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
