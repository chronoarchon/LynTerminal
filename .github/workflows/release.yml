name: Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Frontend Dependencies
        run: bun install

      - name: Build Tauri Application & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LynTerminal v__VERSION__ (v1.5.1v)'
          releaseBody: |
            ## LynTerminal v__VERSION__ (v1.5.1v) — Modern Business OS & Indian GST Terminal

            Fast, Minimalist, 100% Offline-First, Zero-Telemetry Business OS and Full Indian GST Accounting Terminal for Retail Stores, Boutiques, Showrooms, Warehouses & Modern Enterprises.

            ### ⚡ Instant 1-Line Universal Linux Install:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/chronoarchon/LynTerminal/main/install.sh | bash
            ```

            ### 📦 Direct Native Linux Packages (Free Download):
            - **Arch Linux / Manjaro / EndeavourOS**: `lynterminal-1.5.1v-1-x86_64.pkg.tar.zst`
            - **Debian / Ubuntu / Linux Mint**: `lynterminal_1.5.1_amd64.deb`
            - **Fedora / RHEL / openSUSE**: `lynterminal-1.5.1-1.x86_64.rpm`
            - **Universal Standalone**: `lynterminal.gz`

            ### ✨ Key Highlights in v1.5.1:
            - **html2canvas-pro Modern PDF Engine**: Native support for modern OKLab/OKLCh Tailwind v4 colors in regular and GST invoices.
            - **Rule 48 CGST Multi-Copy Bill Prints**: Original, Duplicate, and Triplicate copy modes with badges.
            - **Fixed POS Billing Layout**: Pinned bottom checkout buttons preventing overflow on partial and credit payments.
            - **Uniform Credit Tender**: Compact "Credit" button matching other tenders.
            - **Strict Cash & Bank Liquidity Routing**: Precise separation of cash drawer and bank liquidity.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Native Distribution Packages to GitHub Release
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          gh release upload "${{ github.ref_name }}" \
            "release/lynterminal-1.5.1v-1-x86_64.pkg.tar.zst" \
            "release/lynterminal_1.5.1_amd64.deb" \
            "release/lynterminal-1.5.1-1.x86_64.rpm" \
            "bin/lynterminal.gz" \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
