name: Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Frontend Dependencies & Build Dist
        run: |
          bun install
          bun run build

      - name: Build Tauri Application & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LynTerminal v__VERSION__'
          releaseBody: |
            ## LynTerminal v__VERSION__ — Modern Business OS & Indian GST Terminal

            Fast, Minimalist, 100% Offline-First, Zero-Telemetry Business OS and Full Indian GST Accounting Terminal for Retail Stores, Boutiques, Showrooms, Warehouses & Modern Enterprises.

            ### ⚡ Instant 1-Line Universal Linux Install:
            ```bash
            curl -fsSL https://lynterminal.wintershogun.tech/install.sh | bash
            ```

            ### ✨ Key Highlights in v1.5.3:
            - **Linux WebKitGTK Glitch Fix & Hardware Stabilization**: Eradicated screen tearing, black canvas artifacts, and display glitches by default.
            - **Resilient Auto-Updater & Persistent State**: Seamless updater lifecycle with clean process detachment, atomic binary replacement, and persistent state management.
            - **PDF Engine & CSS Counter Fix**: Eliminated `counterIncrement` runtime exceptions; reliable 80mm thermal and A4 bill printing.
            - **Rule 48 CGST Statutory Bill Prints**: Original (Recipient), Duplicate (Transporter), and Triplicate (Supplier) tax invoice generation.
            - **70% White / 30% Black Luxury Monochrome UI**: Modernized all 23 modals, inputs, and tables with crystal-clear contrast.
            - **Windows Commercial Edition (14-Day Free Trial)**: Hardware node fingerprinting, offline SHA-256 license verification, and multi-currency billing.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Native Distribution Packages to GitHub Release
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          find release bin -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.pkg.tar.zst" -o -name "*.gz" \) -exec gh release upload "${{ github.ref_name }}" {} --clobber + || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
