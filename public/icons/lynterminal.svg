<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Obsidian Obsidian-Slate Surface -->
    <linearGradient id="lyn_lux_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171A23" />
      <stop offset="52%" stop-color="#0D0F15" />
      <stop offset="100%" stop-color="#06070A" />
    </linearGradient>

    <!-- Subtle Cool Ambient Top Light -->
    <radialGradient id="lyn_lux_glow" cx="35%" cy="22%" r="70%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.20" />
      <stop offset="48%" stop-color="#38BDF8" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Brushed Platinum Metallic Rim -->
    <linearGradient id="lyn_lux_rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.34" />
      <stop offset="40%" stop-color="#94A3B8" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.06" />
    </linearGradient>

    <!-- Brushed Titanium-Silver Gradient for the 'L' -->
    <linearGradient id="lyn_lux_letter" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#E4E7EC" />
      <stop offset="100%" stop-color="#9CA3AF" />
    </linearGradient>

    <!-- Crisp Drop Depth behind 'L' -->
    <filter id="lyn_lux_shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#60A5FA" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Modern Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#lyn_lux_bg)" />
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#lyn_lux_glow)" />

  <!-- Subtle Hairline Metallic Border -->
  <rect x="21.5" y="21.5" width="469" height="469" rx="114.5" fill="none" stroke="url(#lyn_lux_rim)" stroke-width="3" />

  <!-- Simple, Bold, Architectural 'L' Monogram -->
  <g filter="url(#lyn_lux_shadow)">
    <path d="M 180 132
             V 328
             C 180 356 200 376 228 376
             H 344"
          fill="none"
          stroke="url(#lyn_lux_letter)"
          stroke-width="68"
          stroke-linecap="round"
          stroke-linejoin="round" />
  </g>
</svg>
